name: Container-Image veröffentlichen

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bastimuensch/fortbildungenuamm

permissions:
  contents: read
  packages: write

jobs:
  veroeffentlichen:
    name: Docker-Image bauen und veröffentlichen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Docker-Compose-Konfiguration prüfen
        env:
          POSTGRES_PASSWORD: compose-pruefung
          JWT_SECRET: compose-pruefung-mit-mindestens-32-zeichen
          APP_BASE_URL: http://localhost:3001
        run: |
          set -euo pipefail
          docker compose config > /tmp/docker-compose.aufgeloest.yml
          docker compose config --images | sort | tee /tmp/docker-compose.images
          grep -Fxq "ghcr.io/bastimuensch/fortbildungenuamm:latest" /tmp/docker-compose.images
          grep -Fxq "postgres:16-alpine" /tmp/docker-compose.images

      - name: QEMU für mehrere Architekturen einrichten
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v4

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags und Metadaten erzeugen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Fortbildungen UAMM
            org.opencontainers.image.description=Fortbildungsportal des Schulamts Memmingen-Unterallgäu

      - name: Image bauen und veröffentlichen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
