# Betrieb auf dem Server. Für die lokale Entwicklung reicht ein Postgres auf
# dem Rechner (siehe README) — dann wird nur der Dienst "db" gebraucht.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fortbildungen_uamm
      POSTGRES_USER: fortbildungen
      # Wert in der .env setzen, nicht hier eintragen.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in der .env}
    volumes:
      - pgdaten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fortbildungen -d fortbildungen_uamm"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Kein Port nach außen: Die Datenbank ist nur im Docker-Netz erreichbar.

  app:
    # In Produktion wird dieses Image von der GitHub Action aus GHCR gezogen.
    # `build` bleibt erhalten, damit lokal weiterhin `docker compose up --build`
    # möglich ist.
    image: ${APP_IMAGE:-ghcr.io/bastimuensch/fortbildungenuamm:latest}
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fortbildungen:${POSTGRES_PASSWORD}@db:5432/fortbildungen_uamm?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET fehlt in der .env}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
      FIBS_IMPORT_ENABLED: ${FIBS_IMPORT_ENABLED:-false}
      FIBS_BASE_URL: ${FIBS_BASE_URL:-https://fibs.alp.dillingen.de}
      FIBS_USER_AGENT_CONTACT: ${FIBS_USER_AGENT_CONTACT:-}
      RETENTION_SCHEDULER: ${RETENTION_SCHEDULER:-on}
      CRON_SECRET: ${CRON_SECRET:-}
      NODE_ENV: production
    ports:
      # Nur an localhost binden — davor gehört ein Reverse Proxy mit TLS.
      - "127.0.0.1:3000:3000"

volumes:
  pgdaten:
